name: CI

# action 一律按 commit SHA 锁定，行尾 `# vX.Y.Z` 只是给人看的（Dependabot 会连注释一起改）。
# 可变 tag（@v4）意味着上游能在不改本仓库的情况下换掉要执行的代码，而 CI 是拿 secrets 的地方；
# tests/workflow-pins.test.js 会拦住写回可变 tag 的改动。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Secret scan (built-in)
        run: npm run security

      - name: Lint
        run: npm run lint

      - name: Fixture tests
        run: npm test

      # tests/index.test.js carries the Cordis-contract regression (the 0.3.3
      # entry exported no apply() and the harness refused to start). It only
      # runs under node:test, so this step is what actually guards it.
      - name: node:test suite
        run: npm run test:node

      - name: Validate
        run: npm run validate

  # 转写引导脚本的平台分支只能在真实 runner 上验证：三个 OS 各跑一次 --self-check
  # （只解析路径，不安装、不下载、不联网）。真正的转写不在 CI 里跑——需要 uv 与
  # 484MB 模型，成本过高，由本机真机验证覆盖。
  # 除 --self-check 外，这里还跑与 ubuntu 的 test 作业同一套门禁（security / lint /
  # fixture / node:test / validate）——「三平台同等支持」这句话得靠三平台各跑一遍撑着，
  # 只在 ubuntu 上跑测试不算数。
  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Secret scan (built-in)
        run: npm run security

      - name: Lint
        run: npm run lint

      - name: Fixture tests
        run: npm test

      - name: node:test suite
        run: npm run test:node

      - name: Validate
        run: npm run validate

      - name: Transcribe bootstrap resolves platform paths
        run: node scripts/transcribe.js --self-check
