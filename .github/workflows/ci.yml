name: CI

# action 一律按 commit SHA 锁定，行尾 `# vX.Y.Z` 只是给人看的（Dependabot 会连注释一起改）。
# 可变 tag（@v4）意味着上游能在不改本仓库的情况下换掉要执行的代码，而 CI 是拿 secrets 的地方；
# tests/workflow-pins.test.js 会拦住写回可变 tag 的改动。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Secret scan (built-in)
        run: npm run security

      - name: Lint
        run: npm run lint

      - name: Fixture tests
        run: npm test

      # tests/index.test.js carries the Cordis-contract regression (the 0.3.3
      # entry exported no apply() and the harness refused to start). It only
      # runs under node:test, so this step is what actually guards it.
      - name: node:test suite
        run: npm run test:node

      # 覆盖率门槛只在 ubuntu / Node 22 上卡一次：lcov reporter 需要 Node >= 22，
      # 而平台分支（转写、路径、bash）在不同 OS 上执行到的代码不同——同一份阈值
      # 去卡三个平台，结果不是「更严格」，而是 windows 永远红。
      # 这一条是「新增代码有没有被测到」的唯一自动化判据；跑在 cross-platform 作业里
      # 没有意义，所以只挂在 test 作业的 Node 22 上。
      - name: Coverage gate (Node 22, ubuntu only)
        if: matrix.node-version == 22
        run: npm run test:coverage

      - name: Validate
        run: npm run validate

  # 转写引导脚本的平台分支只能在真实 runner 上验证：三个 OS 各跑一次 --self-check
  # （只解析路径，不安装、不下载、不联网）。真正的转写不在 CI 里跑——需要 uv 与
  # 484MB 模型，成本过高，由本机真机验证覆盖。
  # 除 --self-check 外，这里还跑与 ubuntu 的 test 作业同一套门禁（security / lint /
  # fixture / node:test / validate）——「三平台同等支持」这句话得靠三平台各跑一遍撑着，
  # 只在 ubuntu 上跑测试不算数。
  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Secret scan (built-in)
        run: npm run security

      - name: Lint
        run: npm run lint

      - name: Fixture tests
        run: npm test

      - name: node:test suite
        run: npm run test:node

      - name: Validate
        run: npm run validate

      - name: Transcribe bootstrap resolves platform paths
        run: node scripts/transcribe.js --self-check
