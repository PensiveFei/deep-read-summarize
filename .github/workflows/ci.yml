name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Secret scan (built-in)
        run: npm run security

      - name: Lint
        run: npm run lint

      - name: Fixture tests
        run: npm test

      # tests/index.test.js carries the Cordis-contract regression (the 0.3.3
      # entry exported no apply() and the harness refused to start). It only
      # runs under node:test, so this step is what actually guards it.
      - name: node:test suite
        run: npm run test:node

      - name: Validate
        run: npm run validate