name: Publish to npm
run-name: >-
  publish ${{ inputs.publish_ref || github.ref }} | sha=${{ inputs.publish_sha || github.sha }} | mode=${{ inputs.dry_run == 'true' && 'dry-run' || 'real' }} | id=${{ inputs.correlation_id || github.run_id }}

# 通过 npm Trusted Publishing（OIDC）发布，全程不需要任何长期 token，也不需要 OTP。
#
# 触发方式
#   1) GitHub Release 被发布（tag 形如 vX.Y.Z，需与 package.json 的 version 一致）
#   2) 手动：gh workflow run publish.yml --ref main -f publish_ref=refs/tags/vX.Y.Z
#      历史 tag 里不含本文件时必须走这种方式：workflow 定义从 main 取，包内容从 tag 取。
#
# 首次使用前要在 npmjs.com 配一次 Trusted Publisher（只能人工操作）：
#   https://www.npmjs.com/package/deep-read-summarize/access
#     Provider:              GitHub Actions
#     Organization or user:  PensiveFei
#     Repository:            deep-read-summarize
#     Workflow filename:     publish.yml      <- 必须与本文件名逐字一致
#     Environment:           留空
#
# 排查
#   - 403 npm-trusted-publisher-not-configured -> npm 端的仓库名 / workflow 文件名对不上
#   - OIDC token not found                     -> 少了 id-token: write
#   - npm 版本低于 11.5.1                       -> Trusted Publishing 不可用
#
# ⚠️ 「绿了」不等于发出去了：npm publish 成功后 registry 要一两分钟才对外可见，第一时间
#   `npm view` 会得到 E404、看着像失败 —— 判据要落在日志里的
#   `+ deep-read-summarize@X.Y.Z` 与 `Signed provenance statement`。
#   反过来，`--dry-run` 全绿也不能当发布成功的证据：npm 的 OIDC 换票失败会被 CLI
#   静默吞掉，真正的校验发生在写 registry 的那一刻（未配 Trusted Publisher 时报 404）。
#
# ⚠️ `release` 事件的投递不稳（2026-09-24 在姊妹仓库实测：给历史 tag 补建 Release 时它
#   **没有触发**，而同日另一个 Release 又正常触发）。补发历史 tag 请优先用上面的手动 dispatch。
#
# 安全说明：本文件不引用任何 secret。若将来要加 secret，先想清楚谁有权改这个 workflow
# —— 能改它的人就能让 CI 拿到仓库里的全部 secrets。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_ref:
        description: '要发布的 tag ref（必填，例如 refs/tags/v0.3.8）。留空 = 用本次运行的 ref，而分支 ref 会被拒绝'
        required: false
        default: ''
      dry_run:
        description: '只演练不发布（true = npm publish --dry-run）'
        required: false
        default: 'false'
      publish_sha:
        description: '预期 tag 的 commit SHA（自动发布脚本填写，防止 tag 在调度期间改变）'
        required: false
        default: ''
      correlation_id:
        description: '本次调度的唯一标识（自动发布脚本填写）'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: gate and publish (Trusted Publishing)
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag reference before checkout
        id: source
        shell: bash
        env:
          PUBLISH_REF: ${{ inputs.publish_ref }}
          EXPECTED_SHA: ${{ inputs.publish_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          CORRELATION_ID: ${{ inputs.correlation_id || github.run_id }}
        run: |
          set -euo pipefail
          REF="${PUBLISH_REF:-}"
          if [ -z "$REF" ]; then
            if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
              echo "::error::empty publish_ref requires a tag event, not a branch"
              exit 1
            fi
            REF="${GITHUB_REF:-}"
          fi
          if [[ ! "$REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::publish_ref must be a complete refs/tags/vX.Y.Z reference"
            exit 1
          fi
          git check-ref-format "$REF"
          case "${DRY_RUN:-false}" in
            true) MODE=dry-run ;;
            false|"") MODE=real ;;
            *) echo "::error::dry_run must be true or false"; exit 1 ;;
          esac
          if [[ ! "${CORRELATION_ID:-}" =~ ^[a-zA-Z0-9._-]{1,80}$ ]]; then
            echo "::error::invalid correlation_id"
            exit 1
          fi
          TAGS=$(git ls-remote --exit-code "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$REF" "${REF}^{}")
          TAG_SHA=$(printf '%s\n' "$TAGS" | awk -v ref="$REF" '$2 == ref { print $1 }')
          PEELED_SHA=$(printf '%s\n' "$TAGS" | awk -v ref="${REF}^{}" '$2 == ref { print $1 }')
          COMMIT="${PEELED_SHA:-$TAG_SHA}"
          if [[ ! "$TAG_SHA" =~ ^[0-9a-f]{40}$ || ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tag was not found or did not resolve to one object"
            exit 1
          fi
          if [ -n "${EXPECTED_SHA:-}" ] && [ "$COMMIT" != "$EXPECTED_SHA" ]; then
            echo "::error::tag commit does not match the dispatched publish_sha"
            exit 1
          fi
          printf 'publish_ref=%s\ncommit=%s\nmode=%s\n' "$REF" "$COMMIT" "$MODE" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.publish_ref }}
          fetch-depth: 0

      # registry-url 是必需的：让 npm publish 解析到公共 registry，也让 npm 的 OIDC
      # 客户端知道去哪个 registry 换发布用的短期凭据。这里不设 NODE_AUTH_TOKEN。
      - name: Set up Node (npm >= 11.5.1 required for Trusted Publishing)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check toolchain
        run: |
          node --version
          NPMV=$(npm --version)
          echo "npm $NPMV"
          MAJOR=${NPMV%%.*}
          MINOR=${NPMV#*.}
          MINOR=${MINOR%%.*}
          if [ "$MAJOR" -lt 11 ] || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; }; then
            echo "::error::npm $NPMV is below 11.5.1 -- Trusted Publishing needs 11.5.1+"
            exit 1
          fi

      - name: Guard package.json version against the ref
        shell: bash
        env:
          PUBLISH_REF: ${{ steps.source.outputs.publish_ref }}
          EXPECTED_SHA: ${{ steps.source.outputs.commit }}
          PUBLISH_MODE: ${{ steps.source.outputs.mode }}
          CORRELATION_ID: ${{ inputs.correlation_id || github.run_id }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          HEAD_SHA=$(git rev-parse --verify 'HEAD^{commit}')
          TAG_SHA=$(git rev-parse --verify "${PUBLISH_REF}^{commit}")
          if [ "$HEAD_SHA" != "$EXPECTED_SHA" ] || [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::checkout/tag commit changed or the tag does not name a commit"
            exit 1
          fi
          if [ "$PKG" != "${PUBLISH_REF#refs/tags/v}" ]; then
            echo "::error::package.json version ($PKG) does not match tag ($PUBLISH_REF)"
            exit 1
          fi
          echo "publish-identity ref=$PUBLISH_REF sha=$TAG_SHA mode=$PUBLISH_MODE correlation=$CORRELATION_ID attempt=$GITHUB_RUN_ATTEMPT"

      # release 事件与手动 dispatch 会对同一个版本各跑一次。已发布不是错误，只是无事可做。
      # 跳过发布步骤并留一条 warning —— 既幂等，也不会把「发过了」伪装成绿。
      - name: Check whether this version is already on npm
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "state=already" >> "$GITHUB_OUTPUT"
            echo "::warning::$NAME@$VER is already on npm -- skipping the publish steps (nothing to do)"
          else
            echo "state=new" >> "$GITHUB_OUTPUT"
            echo "OK: $NAME@$VER is not on npm yet"
          fi

      - name: Install dependencies
        if: steps.published.outputs.state == 'new'
        run: npm ci --ignore-scripts

      - name: Release gate (tests, lint, security)
        if: steps.published.outputs.state == 'new'
        run: |
          npm test
          npm run test:node
          npm run lint
          npm run security

      # 不带 token、不带 --provenance：Trusted Publishing 会自动生成 provenance。
      - name: Publish to npm (OIDC, no token)
        if: steps.published.outputs.state == 'new'
        env:
          PUBLISH_MODE: ${{ steps.source.outputs.mode }}
        run: |
          if [ "$PUBLISH_MODE" = "dry-run" ]; then
            echo "dry-run: 只演练，不上传"
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
